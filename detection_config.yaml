# =============================================================================
# B++ DETECTION CONFIGURATION
# =============================================================================
# Motion-based insect detection + tracking parameters (consumed by bugspot).
#
# UNITS — scene-scale pixel parameters are FRACTIONS of image dimensions, so a
# single config works across resolutions:
#   * lengths  -> fraction of image WIDTH   (min_displacement, max_frame_jump,
#                                             revisit_radius)
#   * areas    -> fraction of image AREA     (min_area, max_area)
# `morph_kernel_size` and `min_density` are the exception: absolute pixel /
# length values, auto-scaled from `reference_resolution` to the detection
# resolution.
#
# This example is tuned for 4K landscape footage, with detection downscaled to
# 1080p for speed.
#
# Usage:
#   results = inference(..., config="detection_config.yaml")
# =============================================================================

# -----------------------------------------------------------------------------
# GMM BACKGROUND SUBTRACTOR
# -----------------------------------------------------------------------------
gmm_history:        500    # frames used to build the background model
gmm_var_threshold:  16     # foreground variance threshold (higher = stricter)

# -----------------------------------------------------------------------------
# MORPHOLOGICAL FILTERING
# -----------------------------------------------------------------------------
# Absolute NxN kernel in pixels (NOT a fraction); auto-scaled from
# reference_resolution to the detection resolution.
morph_kernel_size:  6

# -----------------------------------------------------------------------------
# RESOLUTION (speed + config portability)
# -----------------------------------------------------------------------------
# detection_resolution: [W, H] to run the detector at; bounding boxes are scaled
#   back to native, so tracking/crops/composites stay full-res. null = native.
#   [1920, 1080] is half-4K (~4x fewer pixels than native 4K).
detection_resolution:  [1920, 1080]
# reference_resolution: [W, H] that morph_kernel_size / min_density were tuned
#   for; they auto-scale from here to the detection resolution. null = native.
reference_resolution:  [3840, 2160]

# -----------------------------------------------------------------------------
# COHESIVENESS  (rejects scattered plant motion)
# -----------------------------------------------------------------------------
# Insects are compact single blobs, so they pass easily; this rejects
# scattered/fragmented motion and is orthogonal to chronic suppression
# (blob shape vs. recurring location).
min_largest_blob_ratio: 0.85
max_num_blobs:          3
min_motion_ratio:       0.20

# -----------------------------------------------------------------------------
# SHAPE / SIZE
# -----------------------------------------------------------------------------
min_area:    0.00012   # min contour area, fraction of image area
max_area:    0.0015    # max contour area, fraction of image area
min_density: 3.0       # min area/perimeter (rejects thin shapes)
min_solidity: 0.55     # min convex-hull fill (rejects fragmented shapes)

# -----------------------------------------------------------------------------
# TRACKING
# -----------------------------------------------------------------------------
min_displacement:      0.05   # min NET travel to confirm, fraction of width
min_path_points:       10     # min points before topology analysis
# Track holding — fewer fragmented tracks => less double-counting:
max_frame_jump:        0.10   # max per-frame jump, fraction of width
max_lost_frames:       90     # remember a lost track this many frames
max_area_change_ratio: 3.0    # max area change ratio between frames

# -----------------------------------------------------------------------------
# TRACKER MATCHING (Hungarian)
# -----------------------------------------------------------------------------
tracker_w_dist:         0.6    # distance cost weight
tracker_w_area:         0.4    # area cost weight
tracker_cost_threshold: 0.35   # higher = match to existing tracks more readily

# -----------------------------------------------------------------------------
# PATH TOPOLOGY  (insect-like vs plant-like motion)
# -----------------------------------------------------------------------------
revisit_radius:           0.025  # revisit radius, fraction of width
max_revisit_ratio:        0.35   # insects explore; hovering clutter revisits
min_progression_ratio:    0.60   # min forward progression
max_directional_variance: 0.90   # max heading variance

# -----------------------------------------------------------------------------
# CHRONIC-MOTION SUPPRESSION  (fixed-camera detection filter)
# -----------------------------------------------------------------------------
# Accumulates a per-pixel motion-frequency map and drops detections sitting on
# chronically-moving pixels (wind-blown vegetation, rippling water) BEFORE the
# tracker — cuts clutter and speeds up tracking.
chronic_motion_suppression:   true
chronic_motion_threshold:     0.05  # pixel is "chronic" if moving >= this frac of frames
max_chronic_overlap:          0.2   # drop detection if bbox overlaps chronic > this
chronic_motion_warmup_frames: 30    # accumulate this many frames before dropping
